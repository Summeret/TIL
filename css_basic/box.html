<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이아웃 css연습</title>
    <link href="./styles/reset.css" rel="stylesheet">
    <style>
        .box1 {
            background-color:aqua;
            text-align:center;
            /* height:50px; */
            /* 부모에는 크기(높이)설정을 하지않고 자식의 크기만큼 자동으로 늘어나게 함. */
            /* 예외) 광고배너, 무조건 높이를 정해놔야하는 경우 */
        }
        .box1 > * {
            font-size:3rem;
            border:2px solid #000;
            margin-left:-6px; /* inlie-bloxk으로 인해 생기 여백을 없애기 위해 -여백을 설정해줘야한다. */
        } /* > * -> box1의 모든 자식들은 선택 */
        .box1 h1 {
            display:inline-block; /* 기본여백 2px정도 들어감 -> 완벽한 여백 처리가 필요할때는 block or inline을 사용  */
        }
        .box1 a {
            display:inline-block;
            /* display:none; */ /* 요소의 위치,크기 포함 숨기기 */ 
            width:100px; height:100px;
            visibility:hidden; /* 크기는 유지하는데 안보여야할 때는 display말고 visibility 사용 */
            /* 동적 애니메이션 처리 시 요소의 자리는 유지하고 숨겨야하는 경우 주로 사용 */
        }
        .box1 + a { /* + (형제) a -> a라고 하면 다른 a도 같이 잡힘 */
            width:50%; 
            height:100vh; /* viewport height */
            background-color:lime;
            display:block;
        }
        ul {
            background-color:yellow;
            padding-left:10px;
            padding-top:20px;
            padding-bottom:20px;
        }
        ul li {
            background-color:pink;
            margin-bottom:15px;
            padding-top:10px;
            padding-bottom:10px;
            padding-left:10px;
        }
        /* 형제와 형제의 요소 사이 여백 설정 시 margin */
        /* 부모와 자식 요소 사이 여백 설정 시 padding */
        .box2 {
            background-color:aqua;
            padding:50px 100px 200px 0;
            text-align:right;
            margin:150px 0 0 0;
        }
        .box2 a {
            border:3px dotted #f00;  /* solid, dashed, dotted */
            font-size:5rem;
            display:inline-block;
            /* padding:50px;   상하좌우의 모든 값이 동일할 때 값 1개  */
            /* padding: 1px 2px 3px 4px;   위,오른,아래,왼 값이 각각 다를 때 */
            /* padding:5px 10px;   상하.좌우 값이 2개씩 같은 경우 앞:상하 뒤:좌우 */
            /* padding:5px 10px 0;   상.좌우.하 값 3개 나누기 -> 좌우는 같고 상하가 다를 때 */
        }
    </style>
</head>
<body>
    <div class="box1">
        <h1>h1</h1>
        <a href="#">a</a>
    </div>
    <a href="#">금요일 웹툰보기</a>
    <ul>
        <li>list 1</li>
        <li>list 2</li>
        <li>list 3</li>
        <li>list 4</li>
    </ul>
    <div class="box2">
        <a href="#">LINK</a>
    </div>
</body>
</html>
