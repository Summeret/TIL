<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>외부 스타일시트 연결한 html</title>
    <!-- 내부스타일시트 작성 시 <style></style> -->
    <!-- 외부스타일시트 작성 시 <link> -->
    <link href="./styles/first.css" rel="stylesheet"><!-- rel : 작성한 링크가 스타일시트라고 설정해주는것 (자동 업데이트) html,css 파일 두개 다 저장필수 -->
</head>
<body>
    <div class="title">
        <h1>외부스타일</h1>
        <h2 class="cls" id="name" style="color:purple;">선택자 우선순위</h2>
        <!-- (inline >) ID > Class > Tag -> 순서를 바꿔도 ID의 디자인이 최종적으로 적용된다. 나 뿐만아니라 나를 감싸고 있는 모든 가족관계까지 영향을 받는다. -->
        <!-- inline : 태그안에 스타일을 작성하는 경우, 자바스트립트에서 css 명령 시 inline 구조로 자동으로 삽입된다. 결과적으로 자바스크립트에서 명령한 css가 가장 우선순위가 높게 설정된다.-->
    </div>
</body>
</html>
