<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파과 | 메가박스</title>
    <link rel="stylesheet" href="../css_basic/styles/reset.css">
    <style>
        main {
            width:440px; height:956px;
            background:linear-gradient(45deg, #000, #444, #000);
            margin:0 auto; padding:0 30px;
        }
        main #box_office {}
        main #box_office ul {}
        main #box_office ul li {
            padding-top:80px;
            perspective:1000px; /* 3d 적용할때 제일 먼저 적어주고 시작하기 / 크게 설정하기 -> 카드3d에서 가장많이 사용 1000px */
        }
        main #box_office ul li .poster:hover {
            transform:rotateY(180deg);
        }
        main #box_office ul li .poster >* {
            /* position:absolute; left:0; top:0; */ /* 앞,뒷면 카드 겹치기 -> 디자인으로 겹쳐진 상태일때는 생략*/
            backface-visibility:hidden; /* 뒤집혔을 때 서로 안보여야하니 모든 자식으로 선택자를 만들어서 둘다 숨기기 적용해준다. -> 각자 적용해도 가능 */
        }
        main #box_office ul li .poster {
            position:relative; /* (back)absolute의 위치 부모기준 */
            display:block;
            transform-style:preserve-3d;
            transition:all 0.5s;
        }
        main #box_office ul li .poster .front {
            position:relative; /* (ranking)absolute의 위치 부모기준 */
        }
        main #box_office ul li .poster .front .ranking {
            color:#fff; font-size:2.5rem;
            position:absolute; left:20px; top:10px; /* 겹치기 위한 위치속성 */
            text-shadow:0 5px 10px #000;
        }
        main #box_office ul li .poster .front img {}
        main #box_office ul li .poster .back {
            background-color:rgba(0,0,0,0.7);
            width:380px; height:596px;
            /* text-align:center; */
            padding:30px;
            position:absolute; left:0; top:0; height:100%;
            display:flex; flex-flow:column nowrap; /* 메인축 방향 수직으로 */
            justify-content:space-between; /* 메인축 정렬(양끝) */
            transform:rotateY(180deg);
        }
        main #box_office ul li .poster .back * {
            color:#fff; font-size:0.875rem;
        }
        main #box_office ul li .poster .back h2 {}
        main #box_office ul li .poster .back p {
            line-height:1.6;
        }
        main #box_office ul li .poster .back .score_g {
            padding:25px 0 0;
            border-top:1px solid #fff;
            text-align:center;
        }
        main #box_office ul li .poster .back .score_g span {
            margin-right:30px;
        }
        main #box_office ul li .poster .back .score_g .score {
        margin-right:0;
        font-size:2.5rem;
        }
    </style>
</head>
<body>
    <main>
        <div id="box_office">
            <ul>
                <li></li>
                <li>
                    <a href="#" class="poster">
                        <div class="front">
                            <em class="ranking">2</em>
                            <img src="./image/poster.jpg" alt="파과">
                        </div>
                        <div class="back">
                            <h2>지킬 게 생긴 킬러 VS 잃을 게 없는 킬러</h2>
                            <p>40여년 간 감정 없이 바퀴벌레 같은 인간들을 방역해온 60대 킬러 ‘조각’(이혜영). ’대모님’이라 불리며 살아있는 전설로 추앙받지만</p>
                            <div class="score_g">
                                <span>관람평</span>
                                <em class="score">8.5</em>
                            </div>
                        </div>
                    </a>
                </li>
                <li></li>
                <li></li>
            </ul>
        </div>
    </main>
</body>
</html>
