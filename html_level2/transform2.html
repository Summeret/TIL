<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform | css</title>
    <link rel="stylesheet" href="../css_basic/styles/reset.css">
    <style>
        #parent {
            background-color:#eee; padding:40px;
        }
        #parent .child {
            width:150px; height:150px; /* transform 적용 전 크기기본세팅 */
            border:1px solid #000;
        }
        #parent .child1 {
            transition:transform 1s;
            transform-origin:right center; /* 중심축 변경 세팅 -> 세팅 안하면 기본이 center center */
        }
        #parent:hover .child1 {
            transform:scaleX(1.5); /* 기본 중심축이 center */
        }
        #parent .child2 {
            position:relative; left:0; top:0; /* 기본값 설정해주기 */
            transition:all 0.5s;
            transform-origin:right bottom;
        }
        #parent:hover .child2 {
            /* transform:rotate(-100deg); */
            /* transform:skewX(-25deg); */
            /* transform:translate(50px, -20px); */ /* (x, y) 순으로 작성해서 이동효과주기 / X or Y 만 적용해주기(X축 Y축 적용할때는 대문자로 쓰기*/
            left:50px; top:-20px;
        }
        /* 내비게이션 만들기 */
        nav {}
        nav .gnb {
            display:flex;
        }
        nav .gnb >li {
            width:400px;
            background-color:#333;
            position:relative;
        }
        nav .gnb >li:hover .lnb {
            /* display:block; */
            transform:scaleY(1) translateY(0);
            opacity:1;
        }
        nav .gnb >li > a {
            color:#fff;
            display:block; /* 선택영역 넓게 */
            text-align:center;
            line-height:40px;
        }
        nav .gnb >li > .lnb {
            background-color:#eee;
            position:absolute; left:0; top:40px;
            width:100%; padding-top:10px;
            /* display:none; */ /* 초기숨기기 */
            transform:scaleY(0) translateY(-50px);
            /* scaleY(0) 숨기기, scalieY(1) 보이기  */
            /* scaleX(0) 숨기기, scalieX(1) 보이기  */
            transition:all 0.5s; 
            transform-origin:left top;
            opacity:0;
        }
        nav .gnb >li > .lnb li {}
        nav .gnb >li > .lnb li a {
            display:block;
            text-align:center;
            margin-bottom:10px;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div class="child child1"></div>
        <div class="child child2"></div>
    </div>
    <HR>
    <nav>
        <ul class="gnb">
            <li><a href="#">메엔메뉴1</a>
                <ul class="lnb">
                    <li><a href="#">서브메뉴1</a></li>
                    <li><a href="#">서브메뉴2</a></li>
                    <li><a href="#">서브메뉴3</a></li>
                    <li><a href="#">서브메뉴4</a></li>
                </ul>
            </li>
            <li><a href="#">메엔메뉴2</a></li>
        </ul>
    </nav>
</body>
</html>
