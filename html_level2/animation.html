<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation | keyframe | css</title>
    <link rel="stylesheet" href="../css_basic/styles/reset.css">
    <style>
        main {background:#eee; padding:50px; height:100vh;}
        main .target {}
        main .ball {
            background:radial-gradient(at left top, #fff, #222);
            background-size:150%;
           /*  background-position:100%; */
            width:50px; height:50px;
            border-radius:50%;
            animation:right500 2s linear 0.5s 4 alternate both; /* hover가 아닌 자기 자체에 작성해서 자동재생 */
            /* animation:이름 재생시간 진행속도 지연시간 반복횟수 재생방향 종료스타일; */
            /* keyframe, 재생시간 필수작성 / 반복횟수는 단위 X */
        }
        main .ball2 {
            background:radial-gradient(at left top, #0f0ff0, #eee);
            background-size:150px;
            width:100px; height:100px;
            border-radius:50%;
            animation:bottom400 2s ease-in 1s 4 alternate both;
        }
        /* main .ball3 {animation:zigzag 1s ease-in 4 alternate both;}
        main .ball3 img {width:80px; animation:rotate360 1s ease-in 4 alternate both} */
        /* ================================================ */
        /* HTML텍스트 애니메이션 만들기 */
        section {}
        section .ad {
            height:50vh; padding:50px;
        }
        section .ad span {
            text-transform:uppercase;
            font-size:3rem; font-weight:800;
            display:inline-block;
            animation:ad_txt 0.5s both;
            width:max-content;
            background:linear-gradient(180deg,#131845, #306260, #A257C7, #9C9024);
            color:transparent;
            background-clip:text;
        }
        section .ad span:nth-child(1) {animation-delay:0s;}
        section .ad span:nth-child(2) {animation-delay:0.3s;}
        section .ad span:nth-child(3) {animation-delay:0.6s;}
        section .ad span:nth-child(4) {animation-delay:0.9s;}
        /* ================================================ */
        /* figma 텍스트 애니메이션 */
        section .ad_2 {
            height:50vh; padding:100px;
        }
        section .ad_2 em {
            text-transform:uppercase;
            font-size:3rem; font-weight:800;
            animation:ad_txt2 1s both;
        }
        section .ad_2 em:nth-child(1) {animation-delay:0;}
        section .ad_2 em:nth-child(2) {animation-delay:0.2s;}
        section .ad_2 em:nth-child(3) {animation-delay:0.4s;}
        section .ad_2 em:nth-child(4) {animation-delay:0.6s;}
        section .ad_2 em:nth-child(5) {animation-delay:0.8s;}
        /* ================================================ */
        /* 애니메이션 적용 순서 1. 키프레임(장면) 생성 2.애니메이션 호출 */ /* keyframe은 모아서 작성하기 -> 많아지면 keyframe.css파일 따로 만들기도 함. */
        @keyframes ad_txt {
            from {transform:translateY(50px); opacity:0;}
            to {transform:translateY(0); opacity:1;}
        }
        @keyframes ad_txt2 {
            from {transform:translateY(50px); opacity:0;}
            to {transform:translateY(0); opacity:1;}
        }
        @keyframes right500 {
            from {transform:translateX(0) rotate(0);}
            to {transform:translateX(500px) rotate(360deg);}
        }
        @keyframes bottom400 {
            from {transform:translateY(0) rotate(0);}
            to {transform:translateY(400px) rotate(360deg);}
        }
        @keyframes rotate360 {
            from {transform:rotate(0)}
            to {transform:rotate(360deg)} /* 이동과 회전을 같이 적용해야 할때는 rotate keyframe을 따로 만들기 */
        }
        @keyframes zigzag {
            0% {transform:translate(0,0);}
            25% {transform:translate(500px,0);}
            50% {transform:translate(0,500px);}
            75% {transform:translate(500px,500px);}
        }
    </style>
</head>
<body>
    <main>
        <div class="target ball"></div>
        <div class="target ball2"></div>
        <div class="target ball3"><img src="https://cdn-icons-png.flaticon.com/128/33/33736.png" alt=""></div>
    </main>
    <section>
        <div class="ad">
            <span>h</span>
            <span>t</span>
            <span>m</span>
            <span>l</span>
        </div>
        <div class="ad_2">
            <em>f</em>
            <em>i</em>
            <em>g</em>
            <em>m</em>
            <em>a</em>
        </div>
    </section>
</body>
</html>
