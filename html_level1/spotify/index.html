<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | spotify</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link href="./styles/reset.css" rel="stylesheet">
    <link href="./styles/index.css" rel="stylesheet">
</head>
<body>
    <main>
        <h1><a href="#"><img src="./images/logo.png" alt="spotify"></a></h1>
        <section>
            <!-- 탭제목 -->
            <div class="tab_title">
                <a href="#" class="sign_in active"><span>sign in</span></a> <!-- 중요한 내용이면 이름주기 / h2로 묶어도 되지만 태그는 적게 쓰는걸 추천 -->
                <a href="#" class="sign_up"><span>sign up</span></a>
            </div>
            <!-- 탭내용 -->
            <div class="tab_container">
                <!-- sign in을 클릭 시 열리는 내용 -->
                <form action="#" method="post" id="login_frm">
                    <div class="id_pw">
                        <input type="text" name="user_id" placeholder="Username">
                        <input type="password" name="user_pw" placeholder="Password">
                    </div>
                    <p class="login_stay">
                        <input type="checkbox" name="user_stay" value="user_stay_on" id="user_stay_on">
                        <label for="user_stay_on">stay signed in</label>
                    </p>
                    <div class="btn_search">
                        <button type="submit" class="sign_in_btn">sign in</button>
                        <a href="#" class="pw_search">Forget password?</a>
                    </div>
                </form>
                <!-- sign up을 클릭 시 열리는 내용 -->
                <form action="#" method="post" id="join_frm"></form>
                
            </div>
        </section>
    </main>
</body>
</html>
<!-- tab구조 -->
