<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블태그</title>
    <link href="./styles/reset.css" rel="stylesheet">
    <style>
        /* 수열 선택자 (의미가 없는 요소에 이름을 붙이지 않고 관계와 순서로 대상을 파악해서 선택자를 만드는 방법) */
        #t1 tr td:nth-child(2) {background-color:aqua}
        #t1 tr td:nth-child(1) {background-color:lime}
        #t1,
        #t1 tr, 
        #t1 tr td,
        #t1 tr th {border:2px solid #000;}  /* 속성을 한번만 작성하려면 그룹을 묶어준다. 그룹 -> 태그, !! ,다음에는 반드시 새로운 선택자를 작성*/
        #t2
        #t2 tr,
        #t2 tr td, 
        #t2 tr th {border:2px solid #000;}
        /* 도서재고 표 디자인 */
        #t3 {
            border-radius:20px; /* 부모 모서리 둥글기는 자식의 모양뒤에 있어서 보이지않음. */
            overflow:hidden; /* 넘치는 자식들의 모양을 부모안에서만 보이게 한다. 숨기게한다. */
        }
        #t3 thead {
            background-color:#ff0066;
        }
        #t3 thead tr {}
        #t3 thead tr th {
            color:#fff; /* 꾸미려는거와 가장 가까운태그에 속성넣기 */
        }
        #t3 tbody {
            background-color:#eee;
        }
        #t3 thead tr {}
        #t3 thead tr td {}
    </style>
</head>
<body>
    <!-- 수평,수직 열 합치기 속성 colspan,rowspan  -->
    <!-- td 또는 th 열에만 주는 속성으로 적용 순서는 아래와같다 -->
    <!--
        1. 합치고 싶은 가로방향 열 2개 이상 정하기(개수제한없음)
        2. 위에서 정한 태그 확인하기
        3. 위 태그 중 먼저 시작한 태그속성으로 colspan:"합치는 칸의 개수"
        4. 합쳐지는 첫번째를 제외하고 나머지 태그는 주석으로 가리기 
    -->
    <table id="t1">
        <tr>
            <th colspan="2">1행1열</th> <!-- 글자굵기, 이중선 reset -->
            <!-- <td>1행2열</td> 합친 후에는 주석으로 숨겨서 정리하기-->
        </tr>
        <tr>  <!-- 모든 행에 들어가는 열의 개수는 동일하게 작성한다. -->
            <td>2행1열</td>
            <td>2행2열</td> <!-- 수열선택자로 선택자 새로 만들기 #t1 tr td:nth-child(2) -->
        </tr>
    </table>
    <hr>
    <table id="t2">
        <tr>
            <th colspan="3">1</th>
            <!-- <td>2</td>
            <td>3</td> -->
        </tr>
        <tr>
            <td rowspan="2">4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <!-- <td>7</td> -->
            <td>8</td>
            <td>9</td>
        </tr>
    </table>
    <hr>
    <table id="t3">
        <thead> <!-- 제목행그룹 (제목만 존재) -->
            <tr> <!-- 1행 -->
                <th>제목</th> <!-- 제목열 -->
                <th>종류</th>
                <th>가격</th>
                <th>수량</th>
                <th>비고</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>사망플래그</td>
                <td>도서</td>
                <td>50,000</td>
                <td>300</td>
                <td>재고없음</td>
            </tr>
            <tr>
                <td>설마 죽기야 하겠어</td>
                <td>도서</td>
                <td>40,000</td>
                <td>212</td>
                <td>-</td>
            </tr>
        </tbody>
    </table>
    <br>
    <table id="t4">
        <thead>
            <tr>
                <th>제목1</th>
                <th>제목2</th>
            </tr>
        </thead>
        <tfoot> <!-- tfoot은 밑이기때문에 화면에 보이는 건 똑같지만 스마트리더기는 문서가 작성된 순서대로 읽는다. -->
            <tr>
                <th>제목</th>
                <th>결과</th>
            </tr>
        </tfoot>
        <tbody>
            <tr>
                <td>내용1</td>
                <td>내용2</td>
            </tr>
            <tr>
                <td>내용1</td>
                <td>내용2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
