<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 입력, 선택 컨트롤 양식 폼</title>
    <style>
        legend {display:none;} /* reset.css 모든 html적용 초기화 기준 */
    </style>
</head>
<body>
    <!-- 사용자 입력, 컨트롤 묶음 틀로 form 작성 -->
    <!-- action 사용자가 입력,선택한 데이터를 전송하는 서버 -->
    <!-- method 데이터 전송 시 전송 방법 get or post -->
    <form action="#" method="post" id="join_frm">
        <!-- fieldset 전체 폼 태그 안에 안 그룹이 필요할 경우 작성 -->
        <!-- legend 그룹의 제목 (데이터 구분 목적, 실제 디자인에서는 숨김) -->
        <fieldset>
            <legend>아이디, 비밀번호, 이메일 입력양식</legend>    <!-- input 한줄입력칸 -->
            <span>리뷰작성</span>
            <textarea name="user_review" rows="5" cols="50" placeholder="100글자 이상 작성하셔야 리뷰 등록됩니다."></textarea><br>
            <span>받는사람 : </span>
            <input type="text" multiple name="receiving"><br> <!-- type은 반드시 맨 앞에, 나머지 속성은 순서 상관 no, 속성과 속성 사이는 띄어쓰기 -->
            <span>사진첨부 : </span>
            <input type="file" accept="image/*" name="user_photo"><br>
            <span>아이디 : </span>
            <input type="text" placeholder="아이디 8~12글자 제한" name="user_id" required maxlength="10" size="15" autocomplete="on">
            <button type="submit">아이디 중복 확인</button><br>    
            <span>비밀번호 : </span><input type="password" name="user_pw"><br>
            <span>주민등록번호 : </span>
            <input type="tsxt" name="resident_first" maxlength="6"> - <input type="password" name="resident_last" maxlength="1"><br>
            <span>주문수량 : </span><input type="number" name="order_num" value="1"><br>
            <input type="email">
            <input type="search">
            <input type="date">
            <input type="time">
            <input type="url">
        </fieldset>
        <fieldset>
            <legend>개인정보 입력 및 선택양식</legend>
            <dl>
                <dt>성별</dt>
                <dd>
                    <label for="male">남</label> <!-- label이 형제일 때 for는 필수! -->
                    <input type="radio" name="gender" value="male" id="male">
                    <label for="female">여</label> 
                    <input type="radio" name="gender" value="female" id="female">
                    <label for="none">선택안함</label> 
                    <input type="radio" name="gender" value="none" id="none">
                </dd>
                <dt>선호직업</dt>
                <dd>아래 항목 중 하나만 선택하세요.</dd>
                <dd>
                    <label> <!-- label을 부모로 썼을 때 for는 선택 -->
                        <span>웹디자이너</span> <!-- 대신 label을 부모로 썼을 때 글자는 별개의 태그로 묶어줘야 함 -->
                        <input type="radio" name="job" value="web_designer">
                    </label>
                    <label>
                        <span>웹퍼블리셔</span>
                        <input type="radio" name="job" value="web_publisher">
                    </label>
                    <label>
                        <span>프론트엔드 개발자</span> 
                        <input type="radio" name="job" value="prontend_developer">
                    </label>
                </dd>
                <dt>css 문제. 우선순위가 클래스보다 높은 것을 선택하세요.</dt>
                <dd>아래 항목중 정답에 해당하는 2개 이상을 선택하세요.</dd>
                <dd>
                    <label for="tag">tag</label><input type="checkbox" name="html_tag" value="tag" id="tag">
                    <label for="class">class</label><input type="checkbox" name="html_tag" value="class" id="class">
                    <label for="id">id</label><input type="checkbox" name="html_tag" value="id_y" id="id">
                    <label>
                        <span>inline</span>
                        <input type="checkbox" name="html_tag" value="inline_y" id="inline">
                    </label>
                    <label>
                        <span>style</span>
                        <input type="checkbox" name="html_tag" value="style" id="style">
                    </label>
                </dd>
            </dl>
        </fieldset>
        <fieldset>
            <legend>휴대폰 인증번호 양식</legend>
        </fieldset>
        <fieldset>
            <legend>인증 약관 동의양식</legend>
            <button type="button" id="certified_btn">인증요청</button>
            <button type="button" id="id_overlapping_btn">아이디 중복 확인</button>
            <button type="button" id="address_search_btn">주소검색</button>
            <button type="button" id="cart_btn">장바구니</button>
            <button type="button" id="review_btn">리뷰등록</button>
        </fieldset>
    </form>
</body>
</html>
