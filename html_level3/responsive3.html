<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형웹3 | css </title>
    <link rel="stylesheet" href="../css_basic/styles/reset.css">
    <style>
        /* desktop 1025 ~ 100%(3열) */
        /* tablet 769 ~ 1024(2열) */
        /* mobile 320 ~ 768(1열) */
        #youtube_wrap {
            width:100%;
            min-width:320px;
        }
        #youtube_wrap header {
            height:56px; width:100%;
            background-color:purple;
            /* position:foxed; top:0; */
            position:sticky; top:0;
        }
        #youtube_wrap main {
            display:flex; flex-flow:row nowrap;
        }
        #youtube_wrap main aside {
            background-color:yellowgreen;
            height:calc(100vh - 56px); /* header와 세로 영역을 나눠가져야함 -> 스크롤이 끝날 때 header를 덮지않음 */
            width:240px; /* 반응형 상태에서 고정영역은 px 허용 */
            position:sticky; top:56px; /* 웹브라우저 특정위치(top0)에 닿으면 부모(main)의 세로크기(자식 최대높이만큼 인식)가 끝날때까지 화면에 고정시킨다. */
        }
        #youtube_wrap main section {
            background-color:yellow;
            height:200vh; width:calc(100% - 240px)
        }
        #youtube_wrap main section .mv {
            display:flex; flex-flow:row wrap;
        }
        #youtube_wrap main section .mv li {
            width:calc(100% / 3); height:300px;
        }
        #youtube_wrap main section .mv li:nth-child(odd) {background-color:pink}
        #youtube_wrap main section .mv li:nth-child(even) {background-color:aqua}
        @media screen and (max-width:1024px) {
            #youtube_wrap main aside {display:none;} /* 사이드 숨기기 */
            #youtube_wrap main section {width:100%;} /* 사이드 뺀값 제거하고 100% 인식 */
            #youtube_wrap main section .mv li {width:calc(100% / 2)}
        } /* 769~1024 end */
        @media screen and (max-width:768px) {
            #youtube_wrap main section .mv li {width:100%}
        } /* 320~768 end */
    </style>
</head>
<body>
    <div id="youtube_wrap">
        <header>header</header>
        <main>
            <aside>왼쪽고정영역</aside>
            <section>
                <ul class="mv">
                    <li>1</li>
                    <li>2</li>
                    <li>3</li>
                    <li>4</li>
                    <li>5</li>
                    <li>6</li>
                    <li>7</li>
                    <li>8</li>
                    <li>9</li>
                    <li>10</li>
                </ul>
            </section>
        </main>
    </div>
</body>
</html>
